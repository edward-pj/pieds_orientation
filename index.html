<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PIEDS • Orientation</title>
  <meta name="description" content="PIEDS Student Team Orientation Scavenger Hunt & Countdown">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Toast Notification for QR Scans -->
  <div id="toast-banner" class="toast-banner" role="status" aria-live="polite">
    <span class="toast-dot"></span>
    <span id="toast-message">Location #1 Discovered</span>
  </div>

  <!-- Header: Minimalist Logo -->
  <header class="site-header">
    <div class="logo-wrapper" id="logo-wrapper" title="PIEDS">
      <!-- Tries custom logo.png first; automatically falls back to vector logo.svg -->
      <img src="assets/images/logo.png" 
           alt="PIEDS Logo" 
           class="site-logo" 
           id="site-logo"
           onerror="this.onerror=null; this.src='assets/images/logo.svg';">
    </div>
  </header>

  <!-- Main Stage: Digital Red LED Countdown Timer -->
  <main class="main-stage">
    <div class="timer-container">
      
      <div class="timer-display-box" role="timer" aria-live="off">
        <!-- Unit Labels in Logical Order: DAYS, HOURS, MINUTES, SECONDS -->
        <div class="timer-labels-grid" aria-hidden="true">
          <span class="timer-label">DAYS</span>
          <span class="timer-label-spacer">:</span>
          <span class="timer-label">HOURS</span>
          <span class="timer-label-spacer">:</span>
          <span class="timer-label">MINUTES</span>
          <span class="timer-label-spacer">:</span>
          <span class="timer-label">SECONDS</span>
        </div>

        <!-- Main LED Digits Display (with hardware-accelerated reflection) -->
        <div class="timer-digits timer-digits-main">
          <span class="digit-segment" id="days">00</span>
          <span class="digit-colon">:</span>
          <span class="digit-segment" id="hours">00</span>
          <span class="digit-colon">:</span>
          <span class="digit-segment" id="minutes">00</span>
          <span class="digit-colon">:</span>
          <span class="digit-segment" id="seconds">00</span>
        </div>

        <!-- Fallback reflection for browsers without -webkit-box-reflect support -->
        <div class="timer-reflection-fallback" aria-hidden="true">
          <div class="timer-digits">
            <span class="digit-segment" id="ref-days">00</span>
            <span class="digit-colon">:</span>
            <span class="digit-segment" id="ref-hours">00</span>
            <span class="digit-colon">:</span>
            <span class="digit-segment" id="ref-minutes">00</span>
            <span class="digit-colon">:</span>
            <span class="digit-segment" id="ref-seconds">00</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Minimalist Quest Progress / FOMO Tracker -->
    <section class="quest-section" aria-label="Campus Scavenger Progress">
      <div class="quest-status-text" id="quest-status-text">
        0 out of 9 locations scanned
      </div>

      <!-- 9 Discrete Checkpoint Slots -->
      <div class="checkpoint-slots" id="checkpoint-slots">
        <!-- Generated dynamically by app.js (01 to 09) -->
      </div>
    </section>
  </main>

  <!-- Minimalist Bottom Space -->
  <footer class="site-footer">
    <span class="footer-tag">BITS PILANI</span>
  </footer>

  <!-- Secret Dev / Simulation Panel (Toggled by 3 rapid taps on the logo or '?debug=1') -->
  <div id="dev-panel" class="dev-panel">
    <span class="dev-title">Test / QR Simulator</span>
    <div class="dev-buttons">
      <button class="dev-btn" onclick="simulateScan(1)">Scan Loc #1</button>
      <button class="dev-btn" onclick="simulateScan(4)">Scan Loc #4</button>
      <button class="dev-btn danger" onclick="resetQuest()">Reset All</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
